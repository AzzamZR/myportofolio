<div class="action-buttons">
    <a href="{% url 'main:edit_experience' experience.id %}" class="button button-edit">
        Edit
    </a>
    {% if user.is_superuser %}
    <button type="button"
            class="button button-danger"
            popovertarget="delete-exp-{{ experience.id }}"
            aria-label="Hapus {{ experience.title }}"
            title="Hapus experience">
        Hapus Experience
    </button>
    {% endif %}
</div>

{% if user.is_superuser %}
<div id="delete-exp-{{ experience.id }}"
     class="modal-dialog"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-exp-title-{{ experience.id }}">
    <button type="button"
            class="modal-backdrop"
            popovertarget="delete-exp-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="modal-content">
        <button type="button"
                class="modal-close"
                popovertarget="delete-exp-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>
        <h2 id="delete-exp-title-{{ experience.id }}">Hapus Experience?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ experience.title }}</strong>?</p>
        
        <form method="post" action="{% url 'main:delete_experience' experience.id %}" class="modal-delete-form">
            {% csrf_token %}
            <div class="modal-actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-exp-{{ experience.id }}"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
{% endif %}
