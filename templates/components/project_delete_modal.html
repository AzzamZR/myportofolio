<div class="action-buttons">
    <a href="{% url 'main:edit_project' project.id %}" class="button button-edit">
        Edit
    </a>
    <button type="button"
            class="button button-danger"
            popovertarget="delete-prj-{{ project.id }}"
            aria-label="Hapus {{ project.title }}"
            title="Hapus proyek">
        Hapus Proyek
    </button>
</div>

<div id="delete-prj-{{ project.id }}"
     class="modal-dialog"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-prj-title-{{ project.id }}">
    <button type="button"
            class="modal-backdrop"
            popovertarget="delete-prj-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="modal-content">
        <button type="button"
                class="modal-close"
                popovertarget="delete-prj-{{ project.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">&times;</button>
        <h2 id="delete-prj-title-{{ project.id }}">Hapus Proyek?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ project.title }}</strong>?</p>
        
        <form method="post" action="{% url 'main:delete_project' project.id %}" class="modal-delete-form">
            {% csrf_token %}
            <div class="modal-pin-group">
                <input type="password" 
                       name="secret_passcode" 
                       placeholder="Masukkan PIN untuk menghapus" 
                       required 
                       class="search-input">
            </div>
            <div class="modal-actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-prj-{{ project.id }}"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </div>
        </form>
    </div>
</div>
